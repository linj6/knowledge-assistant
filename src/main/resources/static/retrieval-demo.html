<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Knowledge Assistant · 检索实验台</title>
  <style>
    :root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--ink:#142033;--muted:#69778d;--edge:#dfe6ef;--accent:#3658d6;--ok:#157753;--bad:#b93845;--soft:#eef2ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.58 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}
    .wrap{max-width:1220px;margin:auto;padding:30px 22px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:25px}h1{font-size:26px;letter-spacing:-.5px;margin:0}h2{font-size:17px;margin:0 0 16px}h3{font-size:14px;margin:0}.lead{color:var(--muted);margin:7px 0 0}.chip{border:1px solid var(--edge);border-radius:20px;padding:5px 12px;color:var(--muted);white-space:nowrap}
    .panel{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:23px;box-shadow:0 6px 24px rgba(28,48,80,.035);margin-bottom:20px}label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}input,textarea{width:100%;font:inherit;border:1px solid #cdd7e4;border-radius:9px;padding:10px 12px;color:var(--ink);background:#fff;outline:none}input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #3658d619}textarea{resize:vertical;min-height:90px}input[type=number]{font-variant-numeric:tabular-nums}input[type=checkbox]{width:auto;accent-color:var(--accent)}.two{display:grid;grid-template-columns:220px 1fr;gap:16px}.strategies{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 18px}.check{display:flex;align-items:center;gap:8px;font-weight:500;padding:8px 11px;border:1px solid var(--edge);border-radius:9px;margin:0;cursor:pointer}.params{display:grid;grid-template-columns:repeat(5,minmax(105px,1fr));gap:12px;margin-top:10px}.action{margin-top:19px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}button{font:inherit;font-weight:600;background:var(--accent);color:white;border:0;border-radius:10px;padding:11px 23px;cursor:pointer}button:hover{filter:brightness(.94)}button:disabled{opacity:.58;cursor:wait}.help,.meta{color:var(--muted);font-size:12px}.notice{background:#fff6e9;border:1px solid #f3dbac;padding:11px 14px;border-radius:9px;margin:14px 0;color:#865616}.error{background:#fff2f3;border:1px solid #f6cdd1;padding:12px 15px;border-radius:9px;color:var(--bad);margin:14px 0;overflow-wrap:anywhere}.success{color:var(--ok)}.failed{color:var(--bad)}.empty{color:#a36b11}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.result{border:1px solid var(--edge);border-radius:13px;padding:17px;min-width:0}.reshead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px}.status{font-size:11px;border-radius:20px;border:1px solid currentColor;padding:2px 8px;font-weight:700}.counts{font-size:12px;color:var(--muted);margin-bottom:13px;overflow-wrap:anywhere}.entry{border-top:1px solid var(--edge);padding:12px 0}.entry:first-of-type{border-top:none}.entrybar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}.rank{font-size:12px;font-weight:700;color:var(--accent)}.entrybar,.reshead{flex-wrap:wrap;overflow-wrap:anywhere}.id{overflow-wrap:anywhere;font-size:12px;color:var(--muted)}.content{white-space:pre-wrap;overflow-wrap:anywhere;max-height:150px;overflow:auto;margin:7px 0;font-size:13px}.scores{display:flex;flex-wrap:wrap;gap:6px}.score{background:#f1f4f8;padding:3px 7px;border-radius:5px;font-size:11px;color:#53657f;overflow-wrap:anywhere}.detail{margin-top:12px;border-top:1px solid var(--edge);padding-top:10px}details summary{cursor:pointer;color:var(--accent);font-size:12px;font-weight:600}table{table-layout:fixed;border-collapse:collapse;width:100%;font-size:12px;margin-top:9px}th,td{text-align:left;padding:7px 5px;border-bottom:1px solid var(--edge);vertical-align:top}td{overflow-wrap:anywhere}th{color:var(--muted);font-weight:600}.phase{font-size:12px;font-weight:700;margin:13px 0 3px}.muted{color:var(--muted)}.footer{font-size:12px;color:var(--muted);margin-top:14px}.hidden{display:none!important}@media(max-width:780px){.two,.results{grid-template-columns:1fr}.params{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:20px 14px 45px}header{align-items:flex-start;flex-direction:column}h1{font-size:23px}.panel{padding:16px}}
  </style>
</head>
<body>
<main class="wrap">
  <header><div><h1>Knowledge Assistant <span style="color:var(--accent)">/ 检索实验台</span></h1><p class="lead">对同一个问题比较 VECTOR、BM25、RRF 和 Rerank · 使用真实检索 API</p></div><span class="chip">M2 · Retrieval</span></header>
  <section class="panel" aria-labelledby="form-title"><h2 id="form-title">查询配置</h2>
    <form id="searchForm">
      <div class="two"><div><label for="kb">知识库 ID</label><input id="kb" type="text" inputmode="numeric" autocomplete="off" placeholder="例如 601" required></div><div><label for="query">检索问题</label><textarea id="query" required placeholder="例如：RabbitMQ Consumer ACK 和重试如何工作？"></textarea></div></div>
      <label style="margin-top:15px">检索策略</label>
      <div class="strategies" id="strategyChoices">
        <label class="check"><input type="checkbox" value="VECTOR" checked> VECTOR</label>
        <label class="check"><input type="checkbox" value="BM25" checked> BM25</label>
        <label class="check"><input type="checkbox" value="HYBRID_RRF" checked> HYBRID_RRF</label>
        <label class="check"><input type="checkbox" value="HYBRID_RERANK" checked> HYBRID_RERANK</label>
      </div>
      <details><summary>高级参数（默认：20 / 20 / 60 / 20 / 5）</summary>
        <div class="params">
          <div><label for="vectorTopK">vectorTopK</label><input id="vectorTopK" type="number" min="1" max="100" value="20" required></div>
          <div><label for="bm25TopK">bm25TopK</label><input id="bm25TopK" type="number" min="1" max="100" value="20" required></div>
          <div><label for="rrfK">rrfK</label><input id="rrfK" type="number" min="1" max="1000" value="60" required></div>
          <div><label for="fusionTopK">fusionTopK</label><input id="fusionTopK" type="number" min="1" max="100" value="20" required></div>
          <div><label for="finalTopK">finalTopK</label><input id="finalTopK" type="number" min="1" max="100" value="5" required></div>
        </div>
      </details>
      <div class="action"><button id="submit" type="submit">执行检索</button><span id="hint" class="help" role="status">请先导入并发布知识库文档；需要启用对应的模型和 ES 配置。</span></div>
    </form>
    <div class="notice">此页面只展示检索证据，并不生成 RAG 答案。使用当前同源后端 API，不保存请求、密钥或检索正文。</div>
    <div id="error" class="error hidden" role="alert"></div>
  </section>
  <section class="panel hidden" id="output" aria-live="polite"><h2>四策略结果对照</h2><div id="requestMeta" class="meta"></div><div id="resultGrid" class="results" style="margin-top:16px"></div></section>
  <p class="footer">演示页面仅用于本地开发与调试。阶段耗时是单次请求的测量值；不同策略可能共享同一次召回，不能直接把它们相加当作请求总耗时。</p>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const form = $('searchForm');
  const names = ['vectorTopK','bm25TopK','rrfK','fusionTopK','finalTopK'];
  const number = (value) => typeof value === 'number' && Number.isFinite(value) ? String(value) : '—';
  const text = (tag, value, className) => { const el = document.createElement(tag); if (className) el.className = className; el.textContent = value == null ? '' : String(value); return el; };
  const add = (node, ...children) => { node.append(...children); return node; };
  const showError = message => { $('error').textContent = message; $('error').classList.remove('hidden'); };
  const clearError = () => { $('error').textContent = ''; $('error').classList.add('hidden'); };
  function validate(kb, query, strategies, parameters) {
    if (!/^[1-9]\d*$/.test(kb) || BigInt(kb) > 9223372036854775807n) return '知识库 ID 必须是正整数，且不能超过 Java Long 范围。';
    if (!query.trim()) return '请输入检索问题。';
    if (!strategies.length) return '至少选择一种检索策略。';
    for (const name of names) { const n=parameters[name]; if (!Number.isInteger(n) || n < 1 || n > (name === 'rrfK' ? 1000 : 100)) return name + ' 不在允许范围内。'; }
    for (const strategy of strategies) {
      const pool = strategy === 'VECTOR' ? parameters.vectorTopK : strategy === 'BM25' ? parameters.bm25TopK : parameters.fusionTopK;
      if (parameters.finalTopK > pool) return `finalTopK 不得超过 ${strategy} 的候选池。`;
    }
    if (strategies.some(s=>s.startsWith('HYBRID')) && parameters.fusionTopK > parameters.vectorTopK+parameters.bm25TopK) return 'fusionTopK 不得超过 vectorTopK 与 bm25TopK 之和。';
    return null;
  }
  function stageView(stage) {
    const section = document.createElement('div');
    add(section,text('div', `${stage.phase ?? '未知阶段'} · ${number(stage.elapsedMillis)} ms · ${stage.candidateCount ?? 0} 条`, 'phase'));
    const candidates = Array.isArray(stage.candidates) ? stage.candidates : [];
    if (!candidates.length) { add(section,text('div','无候选','muted')); return section; }
    const table = document.createElement('table');
    const head = document.createElement('thead');const hr=document.createElement('tr');
    for(const label of ['Rank','Chunk ID','阶段分数']) hr.append(text('th',label));head.append(hr);table.append(head);
    const body=document.createElement('tbody');
    for(const c of candidates){const tr=document.createElement('tr');for(const v of [c.rank,c.chunkId,number(c.score)])tr.append(text('td',v));body.append(tr);}table.append(body);section.append(table);
    return section;
  }
  function resultView(result, index) {
    const panel=document.createElement('article');panel.className='result';
    const d=result?.diagnostics ?? {};const chunks=Array.isArray(result?.chunks)?result.chunks:[];
    const head=document.createElement('div');head.className='reshead';
    const status=String(d.status ?? 'UNKNOWN');const state=text('span',status,'status '+(status==='SUCCESS'?'success':status==='FAILED'?'failed':'empty'));
    add(head,text('h3',d.requestedStrategy ?? `策略 ${index+1}`),state);panel.append(head);
    panel.append(text('div',`${chunks.length} 条最终结果 · 实际策略 ${d.actualStrategy ?? '无'} · ${d.error ?? '无错误'}`,'counts'));
    for (const c of chunks) {
      const item=document.createElement('section');item.className='entry';const bar=document.createElement('div');bar.className='entrybar';
      add(bar,text('span',`#${c.finalRank ?? '?'} · Chunk ${c.chunkId ?? '?'}`,'rank'),text('span',`D ${c.documentId ?? '?'} · V ${c.indexVersionId ?? '?'}`,'id'));
      item.append(bar,text('div',c.content ?? '', 'content'));
      const scores=document.createElement('div');scores.className='scores';
      for(const [label,val] of [['向量排名',c.vectorRank],['向量距离',c.vectorDistance],['BM25 排名',c.bm25Rank],['BM25 分数',c.bm25Score],['RRF',c.rrfScore],['Rerank',c.rerankScore]]) if(val != null) scores.append(text('span',label+': '+number(val),'score'));
      item.append(scores,text('div',`位置 ${c.sourceStart ?? '?'}–${c.sourceEnd ?? '?'} · ${c.headingPath ?? '无标题路径'}`,'help'));panel.append(item);
    }
    if (!chunks.length) panel.append(text('p',status==='FAILED'?'该策略执行失败，没有返回部分候选。':'没有可见的匹配证据。','muted'));
    const details=document.createElement('details');details.className='detail';details.append(text('summary','阶段诊断与完整候选'));
    add(details,text('div',`Snapshot SHA-256：${d.snapshotHash ?? '不可用'}`,'meta'));
    for(const s of Array.isArray(d.stages)?d.stages:[])details.append(stageView(s));
    panel.append(details);return panel;
  }
  form.addEventListener('submit',async event=>{
    event.preventDefault();clearError();
    const kb=$('kb').value.trim(),query=$('query').value.trim();
    const strategies=[...document.querySelectorAll('#strategyChoices input:checked')].map(el=>el.value);
    const parameters=Object.fromEntries(names.map(name=>[name,Number($(name).value)]));
    const error=validate(kb,query,strategies,parameters);if(error){showError(error);return;}
    const button=$('submit');button.disabled=true;button.textContent='检索中…';$('hint').textContent='正在调用同源检索 API';
    $('output').classList.add('hidden');
    try{
      const response=await fetch('/api/v1/retrieval/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({knowledgeBaseId:kb,query,strategies,parameters}),credentials:'same-origin'});
      let payload;try{payload=await response.json();}catch {throw new Error(`HTTP ${response.status}：服务器没有返回合法 JSON。`);}
      if(!response.ok || payload?.code !== 0)throw new Error(`HTTP ${response.status} / ${payload?.code ?? '未知错误'}：${payload?.message ?? '检索请求失败'}`);
      if(!Array.isArray(payload?.data?.results))throw new Error('响应缺少 data.results 数组。');
      const grid=$('resultGrid');grid.replaceChildren();payload.data.results.forEach((result,i)=>grid.append(resultView(result,i)));
      $('requestMeta').textContent=`Request ID：${payload.requestId ?? response.headers.get('X-Request-Id') ?? '—'} · 请求策略：${strategies.join(' / ')}`;
      $('output').classList.remove('hidden');$('hint').textContent='请求已完成';
    }catch(e){showError(e instanceof Error?e.message:'未知请求错误；请检查服务是否已启动。');$('hint').textContent='请求失败';}
    finally{button.disabled=false;button.textContent='执行检索';}
  });
})();
</script>
</body>
</html>
