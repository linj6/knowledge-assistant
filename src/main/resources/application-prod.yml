# 不继承 local；部署必须提供数据库连接和密码。
spring:
  datasource:
    url: ${KA_DB_URL}
    username: ${KA_DB_USERNAME}
    password: ${KA_DB_PASSWORD}
assistant:
  model:
    enabled: ${ASSISTANT_MODEL_ENABLED:false}
    base-url: ${ASSISTANT_MODEL_BASE_URL:}
    chat-model: ${ASSISTANT_MODEL_CHAT_MODEL:}
    embedding-model: ${ASSISTANT_MODEL_EMBEDDING_MODEL:}
    api-key: ${ASSISTANT_MODEL_API_KEY:}
  rerank:
    enabled: ${ASSISTANT_RERANK_ENABLED:false}
    endpoint: ${ASSISTANT_RERANK_ENDPOINT:}
    model: ${ASSISTANT_RERANK_MODEL:qwen3-rerank}
    api-key: ${ASSISTANT_RERANK_API_KEY:}
