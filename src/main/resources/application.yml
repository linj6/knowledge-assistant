spring:
  application:
    name: knowledge-assistant
  datasource:
    url: ${KA_DB_URL:jdbc:postgresql://localhost:5432/ka}
    username: ${KA_DB_USERNAME:ka}
    password: ${KA_DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: false
assistant:
  model:
    enabled: false
    api-key: ${ASSISTANT_MODEL_API_KEY:}
    timeout-seconds: 30
