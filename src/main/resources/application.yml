server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  data:
    redis:
      host: ${KA_REDIS_HOST:localhost}
      port: ${KA_REDIS_PORT:6379}
      username: ${KA_REDIS_USERNAME:}
      password: ${KA_REDIS_PASSWORD:}
      database: ${KA_REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s
      ssl:
        enabled: ${KA_REDIS_SSL:false}
  session:
    timeout: ${KA_SESSION_TIMEOUT:30m}
    data:
      redis:
        namespace: ${KA_SESSION_NAMESPACE:ka:session}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mvc:
    servlet:
      path: /api
  application:
    name: knowledge-assistant
  flyway:
    enabled: true
    baseline-on-migrate: false
assistant:
  worker:
    enabled: false
    scan-interval: 5s
    batch-size: 1
    lease-duration: 15m
    max-task-duration: 10m
    max-attempts: 4
    retry-backoff: [5s, 15s, 45s]
    retry-jitter: 0.2
  elasticsearch:
    enabled: false
    endpoint: ${KA_ES_ENDPOINT:http://localhost:9200}
  upload:
    max-file-bytes: 2097152
  chunking:
    version: 2
    strategy: FIXED_CODE_POINT
    chunk-size: 800
    chunk-overlap: 120
  minio:
    endpoint: ${KA_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${KA_INFRA_MINIO_USER:}
    secret-key: ${KA_INFRA_MINIO_PASSWORD:}
    bucket: ${KA_MINIO_BUCKET:knowledge-assistant}
  model:
    embedding-model: ${ASSISTANT_MODEL_EMBEDDING_MODEL:text-embedding-v4}
    dimensions: ${ASSISTANT_MODEL_DIMENSIONS:1024}
    enabled: false
    online-authorized: false
    api-key: ""
    timeout-seconds: 30
  embedding:
    max-input-code-points: 800
    baseline-authorized: false
  rerank:
    enabled: false
    online-authorized: false
    api-key: ""
    timeout-seconds: 30
