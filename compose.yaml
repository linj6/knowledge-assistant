name: knowledge-assistant
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17@sha256:40b404964359299eefdd5f8518facf1886c562848cf4de13b6eaf91cb70c2b87
    environment:
      POSTGRES_DB: ka
      POSTGRES_USER: ka
      POSTGRES_PASSWORD: ${KA_INFRA_PG_PASSWORD:?Set KA_INFRA_PG_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ka -d ka"]
      interval: 10s
      timeout: 5s
      retries: 12
  elasticsearch:
    image: knowledge-assistant-elasticsearch:8.18.0-ik8.18.0
    build: ./infra/elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
  minio:
    image: knowledge-assistant-minio:RELEASE.2025-09-07T16-13-09Z-local
    pull_policy: never
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${KA_INFRA_MINIO_USER:?Set KA_INFRA_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${KA_INFRA_MINIO_PASSWORD:?Set KA_INFRA_MINIO_PASSWORD}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
  es-data:
  minio-data:
